# ============================================================
#  realU 主升初期模型 训练配置
#  复制为 config.properties 后修改。记事本保存为 UTF-8 或 ANSI(GBK)均可。
#  Windows 路径可以直接写 C:\new_tdx\vipdoc,也可以写 C:/new_tdx/vipdoc
# ============================================================

# ---------- 数据源 ----------
# day = 直接读通达信 vipdoc 下的 .day 日线(不复权,程序自动做启发式除权处理)
# txt = 读通达信"盘后数据导出"的 txt(推荐导出【前复权】,除权处理最准确)
data.source=day
tdx.vipdoc=C:/new_tdx/vipdoc
data.txtDir=C:/new_tdx/T0002/export
data.markets=sh,sz,bj
data.adjustExRights=true
# 大盘指数(市场环境特征)。txt 模式请把指数一并导出
data.index=sh000001
# 样本起始日期(之前的数据只用于计算均线等指标的预热)
data.startDate=20100101

# ---------- 可选外部数据(没有可留空,程序会用替代特征) ----------
# 股票名称:代码,名称(用于剔除 ST;txt 模式会自动从文件首行读取名称)
data.namesCsv=
# 流通股本:代码,日期,流通股数(股)  或  代码,流通股数   → 真实换手率
data.floatSharesCsv=
# 大单净量:代码,日期,大单净量(%)  —— 通达信离线日线里没有,需要 Level-2 数据源导出;没有就留空
data.bigOrderCsv=
# 通达信安装目录(其下 T0002/hq_cache 有行业、概念板块文件)。留空 = 自动取 vipdoc 的上一级目录
data.tdxRoot=

# ---------- 板块 ----------
# auto     = 找到 hq_cache/tdxhy.cfg 用通达信行业,否则用收益相关性聚类(只有 vipdoc 时)
# industry = 通达信行业;cluster = 聚类板块(每年用之前 250 日数据重算,无未来函数);none = 不用
sector.source=auto
sector.clusters=40
# 通达信行业层级:1 一级 / 2 二级 / 3 三级
sector.industryLevel=2
# 概念板块(hq_cache/block_gn.dat)。注意:概念成分是当前名单,历史回测有未来函数,会偏乐观
sector.useConcepts=true

# ---------- 时间切分(严格按时间,禁止交叉) ----------
# 训练期:startDate ~ trainEnd;验证期:trainEnd ~ validEnd(早停、选阈值、选卖出参数)
# 测试期:validEnd 之后(只做最终检验,不参与任何选择)
split.trainEnd=20191231
split.validEnd=20221231
split.testEnd=99991231

# ---------- 目标:什么算"一次成功的主升周期" ----------
# 信号次日开盘买入;之后允许回撤,但收盘跌破 买入价×(1-maxDrawdown) 判失败(0 = 回撤不限);
# horizon 个交易日内,某日收盘扣成本后盈利 ≥ target 即成功。全部按收盘价判断
label.horizon=60
label.target=0.30
label.maxDrawdown=0.15

# ---------- 候选启动日(硬条件,全部满足才进入模型) ----------
gate.minListedDays=120
gate.minAmount5=30000000
gate.minRet1=0.03
gate.minVolRatio=1.8
gate.maxPriorRise20=0.25
gate.requireUpClose=true
gate.excludeSt=true
gate.resumeCooldown=5

# ---------- 卖出规则(全部按收盘价判断、收盘价成交) ----------
# 留空 = 与目标一致:收盘回撤 maxDrawdown 止损、收盘达 target 止盈、持有 horizon 日
# 动态止盈:收盘浮盈达到 trailingActivate 后,自最高收盘回撤 trailingDrawdown 卖出;
#           profitFloor>0 时激活后收盘跌回 +profitFloor 也卖(锁定利润)
#exit.stopLoss=0.15
#exit.takeProfit=0.303
#exit.trailingActivate=0.40
#exit.trailingDrawdown=0.10
#exit.profitFloor=0.303
#exit.maxHoldDays=60
# true = 在验证期从 76 组规则(固定止盈 / 动态止盈 × 4 档容忍回撤)中与阈值一起选(测试期只检验)
exit.gridSearch=true
# precision = 准确率达标的前提下信号最多;return = 准确率达标的前提下平均收益最高(通常会选中动态止盈)
exit.objective=precision

# ---------- 达标线 ----------
# 测试期(去重后的信号)准确率需 ≥ target.precision 且信号数 ≥ minTestSignals 才判定"达标"
target.precision=0.95
target.minValidSignals=30
target.minTestSignals=30

# ---------- 回测 ----------
backtest.maxPositions=5
# 同一只股票两次信号的最小间隔(交易日)
backtest.cooldownDays=20
# 单笔往返成本(佣金+印花税+滑点)
backtest.cost=0.003

# ---------- 模型参数(一般不用改) ----------
gbdt.rounds=1000
gbdt.learningRate=0.03
gbdt.maxLeaves=15
gbdt.maxDepth=5
gbdt.minDataInLeaf=500
gbdt.lambdaL2=5.0
gbdt.rowSample=0.7
gbdt.featureSample=0.6
gbdt.earlyStopping=100
gbdt.maxBins=64
gbdt.positiveWeight=1.0
# 早停指标:auc(推荐,不受不同时期成功率高低影响)/ logloss
gbdt.earlyStopMetric=auc
# 样本按交易日平衡权重:sqrt(推荐)/ equal / none。防止少数火爆交易日的大量样本让模型"记住行情阶段"
gbdt.dateBalance=sqrt
# 自动比较"全部特征"与"去掉全市场类特征(市场环境+情绪)"等方案,按验证 AUC 选优
gbdt.groupSelect=true
seed=20240601

# ---------- 检验与导出 ----------
# 每种启动类型(箱体突破/超跌反弹/趋势波段/其他)单独选阈值;达不到目标的类型不启用
eval.perPatternThreshold=true
# 每种类型在验证期至少要有的信号数
target.minPatternSignals=15
# 测试期按年滚动重训(每年用之前的全部数据训练),与实盘定期重训一致
eval.walkForward=true
# 导出前用全部已有数据重训,APP 拿到的是见过最新行情的模型
model.refitAll=true

# ---------- 内存与性能 ----------
# 线程数,0 = CPU 核数
threads=0
# 样本数上限(每个样本约 100 字节)
sample.maxRows=6000000
# 训练期负样本保留比例(内存紧张时调小,如 0.5;验证/测试期始终全量)
sample.negativeKeep=1.0
# 堆内存使用率超过该值时自动降采样
memory.maxUsage=0.80
# 检验时只保留验证期概率最高的这部分候选(越大越占内存;95% 准确率的阈值远在这之上)
eval.candidateTop=0.15

# ---------- 输出 ----------
output.dir=out
model.name=主升初期
model.strategyId=i
# CSV 编码:UTF-8-BOM(Excel/WPS 直接打开不乱码,推荐)或 GBK
output.csvEncoding=UTF-8-BOM
# 控制台编码:auto(推荐,配合 train.bat 的 chcp 65001)/ UTF-8 / GBK
console.encoding=auto
